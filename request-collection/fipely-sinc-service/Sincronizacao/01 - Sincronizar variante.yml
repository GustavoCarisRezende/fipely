info:
  name: Sincronizar variante (ano e combustível)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseurl}}/sync/variants?refreshOldRecords={{refreshOldRecords}}"
  headers:
    - name: X-API-Token
      value: "{{apiToken}}"
    - name: Content-Type
      value: application/json
  params:
    - name: refreshOldRecords
      value: "{{refreshOldRecords}}"
      type: query
  body:
    type: json
    data: |-
      {
        "referenceMonth": "{{referenceMonth}}",
        "vehicleType": {{vehicleType}},
        "brandCode": "{{brandCode}}",
        "modelCode": {{modelCode}},
        "modelYear": {{modelYear}},
        "fuelCode": "{{fuelCode}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 202 && res.body?.jobId != null) {
          bru.setVar('jobId', String(res.body.jobId));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
