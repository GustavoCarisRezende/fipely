info:
  name: Sincronizar período completo (carros, motos e caminhões)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseurl}}/sync/periods?refreshOldRecords={{refreshOldRecords}}"
  headers:
    - name: X-API-Token
      value: "{{apiToken}}"
    - name: Content-Type
      value: application/json
  params:
    - name: refreshOldRecords
      value: "{{refreshOldRecords}}"
      type: query
  body:
    type: json
    data: |-
      {
        "referenceMonth": "{{referenceMonth}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
