info:
  name: Sincronizar marca
  type: http
  seq: 3

http:
  method: POST
  url: '{{baseurl}}/sync/brands?refreshOldRecords={{refreshOldRecords}}'
  params:
    - name: refreshOldRecords
      value: '{{refreshOldRecords}}'
      type: query
  headers:
    - name: X-API-Token
      value: '{{apiToken}}'
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "referenceMonth": "{{referenceMonth}}",
        "vehicleType": {{vehicleType}},
        "brandCode": "{{brandCode}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
