info:
  name: Sincronizações em andamento
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseurl}}/sync/jobs"
  headers:
    - name: X-API-Token
      value: "{{apiToken}}"
  params:
    - name: refreshOldRecords
      value: "{{refreshOldRecords}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
