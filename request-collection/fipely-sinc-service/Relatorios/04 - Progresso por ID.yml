info:
  name: Progresso da execução por ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseurl}}/sync/jobs/{{jobId}}?refreshOldRecords={{refreshOldRecords}}"
  headers:
    - name: X-API-Token
      value: "{{apiToken}}"
  params:
    - name: refreshOldRecords
      value: "{{refreshOldRecords}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
