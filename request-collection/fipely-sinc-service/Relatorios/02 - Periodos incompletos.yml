info:
  name: Períodos incompletos por tipo de veículo
  type: http
  seq: 2

http:
  method: GET
  url: '{{baseurl}}/reports/periods/incomplete?refreshOldRecords={{refreshOldRecords}}'
  params:
    - name: refreshOldRecords
      value: '{{refreshOldRecords}}'
      type: query
  headers:
    - name: X-API-Token
      value: '{{apiToken}}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
