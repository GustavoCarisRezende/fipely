info:
  name: Histórico do modelo (todos os anos e combustíveis)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseurl}}/history/models/{{vehicleType}}/{{brandCode}}/{{modelCode}}?refreshOldRecords={{refreshOldRecords}}"
  headers:
    - name: X-API-Token
      value: "{{apiToken}}"
  params:
    - name: refreshOldRecords
      value: "{{refreshOldRecords}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
