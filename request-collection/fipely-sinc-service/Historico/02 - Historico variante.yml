info:
  name: Histórico da variante (ano e combustível)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseurl}}/history/variants/{{vehicleType}}/{{brandCode}}/{{modelCode}}/{{modelYear}}/{{fuelCode}}?refreshOldRecords={{refreshOldRecords}}"
  headers:
    - name: X-API-Token
      value: "{{apiToken}}"
  params:
    - name: refreshOldRecords
      value: "{{refreshOldRecords}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
