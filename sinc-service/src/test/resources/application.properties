# Test-only names are intentionally disjoint from production credentials.
# TestDatabaseSafetyInitializer requires explicit isolated-database opt-in first.
spring.datasource.url=${FIPELY_TEST_DB_URL}
spring.datasource.username=${FIPELY_TEST_DB_USERNAME}
spring.datasource.password=${FIPELY_TEST_DB_PASSWORD}
spring.flyway.schemas=fipe
spring.flyway.create-schemas=true
spring.flyway.default-schema=fipe
app.security.token=${FIPELY_TEST_API_TOKEN}
server.servlet.context-path=/fipely-sinc-service
app.websocket.allowed-origins=http://localhost:*,http://127.0.0.1:*
app.fipe.base-url=${FIPELY_TEST_FIPE_BASE_URL:http://127.0.0.1:9/api/veiculos}
app.fipe.min-request-interval-ms=0
app.fipe.max-concurrent-syncs=2
app.fipe.max-attempts=1
app.fipe.retry-backoff-ms=0
app.fipe.request-timeout-seconds=1
app.fipe.max-backoff-ms=1000
app.fipe.max-retry-after-ms=1000
app.fipe.shared-rate-limit=true
app.fipe.shared-max-interval-ms=1000
app.fipe.reference-period-cache-minutes=1440
app.sync.min-age-days=365
app.sync.queue-workers=2
app.sync.queue-capacity=48
management.endpoints.web.exposure.include=health,metrics
