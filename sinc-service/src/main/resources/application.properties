spring.application.name=sinc-service
server.servlet.context-path=/fipely-sinc-service
spring.datasource.url=${FIPELY_DB_URL:jdbc:postgresql://localhost:5432/fipely}
spring.datasource.username=${FIPELY_DB_USERNAME:postgres}
spring.datasource.password=${FIPELY_DB_PASSWORD}
spring.flyway.schemas=fipe
spring.flyway.create-schemas=true
spring.flyway.default-schema=fipe

app.security.token=${FIPELY_API_TOKEN}
app.fipe.base-url=https://veiculos.fipe.org.br/api/veiculos
app.fipe.min-request-interval-ms=1000
app.fipe.max-concurrent-syncs=2
app.fipe.max-attempts=3
app.fipe.retry-backoff-ms=5000
app.fipe.request-timeout-seconds=30
app.sync.min-age-days=365
